apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: mlops-platform}
  template:
    metadata:
      labels: {app: mlops-platform}
    spec:
      containers:
        - name: mlops-platform
          image: mlops-platform:latest
          imagePullPolicy: Never
          ports: [{containerPort: 8000}]
          envFrom:
            - secretRef: {name: groq-secret}
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            